name: Deploy El Pollo Loco

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Repository herunterladen
              uses: actions/checkout@v4

            - name: El Pollo Loco auf Netcup übertragen
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  password: ${{ secrets.PASSWORD }}
                  port: 22
                  source: 'index.html,impressum.html,style.css,responsive.css,audio/**,classes/**,fonts/**,img/**,scripts/**'
                  target: elpolloloco.franziska-kalloch.de/httpdocs
                  overwrite: true
